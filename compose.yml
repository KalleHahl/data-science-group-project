services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: wine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
 
#  adminer:
#    image: adminer
#    restart: always
#    ports:
#      - 8080:8080
#    depends_on: 
#      - db

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: wine_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
 
volumes:
  pgdata: 